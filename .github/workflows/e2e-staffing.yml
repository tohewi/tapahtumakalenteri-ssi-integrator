name: E2E Staffing SSI Sync

# Runs Playwright E2E tests for staffing ↔ SSI bidirectional sync.
# Triggered manually or on PRs that touch staffing-related code.
#
# To DISABLE: set repository variable E2E_ENABLED = "false"
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target deployment URL'
        required: false
        default: 'https://turres-ssi-tools-pr-138.onrender.com'
  pull_request:
    branches: [main]
    paths:
      - 'scoring-proxy/routes/platform.js'
      - 'scoring-proxy/lib/db/platform-store.js'
      - 'scoring-proxy/lib/ssi-core/**'
      - 'scoring-ui/src/components/platform/**'
      - 'e2e/**'

jobs:
  e2e-staffing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: vars.E2E_ENABLED != 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run staffing SSI sync tests
        run: npx playwright test tests/10-staffing-ssi-sync.spec.js
        working-directory: e2e
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://turres-ssi-tools-pr-138.onrender.com' }}
          PLATFORM_EMAIL: ${{ secrets.PLATFORM_TEST_EMAIL }}
          PLATFORM_PASSWORD: ${{ secrets.PLATFORM_TEST_PASSWORD }}
          SSI_TEST_EMAIL: ${{ secrets.SSI_TEST_EMAIL }}
          CI: 'true'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 14
