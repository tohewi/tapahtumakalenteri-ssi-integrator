name: UAT Tests (Playwright)

# Runs Playwright end-to-end tests against the Render preview environment
# after it has been created or updated by pr-preview.yml.
#
# ── Kill switch ──────────────────────────────────────────────────────
# To DISABLE: set repository variable  E2E_ENABLED = "false"
#   (Settings → Secrets and variables → Actions → Variables)
# To RE-ENABLE: set E2E_ENABLED = "true" or delete the variable.
#
# ── Email bypass strategy ────────────────────────────────────────────
# Invitation tokens are captured directly from the API response
#   (POST /api/v1/platform/tenants/:id/invitations → { invitation: { token } })
# so no real email delivery is needed.  RESEND_API_KEY is intentionally
# left unconfigured so the server silently skips email sending.
#
# ── Required secrets ─────────────────────────────────────────────────
#   PLATFORM_TEST_EMAIL    - Owner account email on the preview env
#   PLATFORM_TEST_PASSWORD - Owner account password on the preview env
#   (Optional) SSI_TEST_EMAIL - SSI email for staffing sync tests

on:
  # Run after the preview workflow has updated the deployment
  workflow_run:
    workflows: ['PR Preview Environment']
    types: [completed]
  # Also allow manual dispatch for debugging
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target URL (e.g. https://turres-ssi-tools-pr-42.onrender.com)'
        required: true
        type: string
      pr_number:
        description: 'PR number (for comments)'
        required: false
        type: string

jobs:
  uat:
    name: Playwright UAT
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip if E2E_ENABLED is explicitly "false", or if workflow_run didn't succeed
    if: >
      vars.E2E_ENABLED != 'false' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request'))

    permissions:
      pull-requests: write
      contents: read

    steps:
      # ── Determine PR info and target URL ────────────────────────────────
      - name: Derive preview URL and PR ref
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "url=${{ inputs.base_url }}" >> $GITHUB_OUTPUT
            echo "pr=${{ inputs.pr_number }}" >> $GITHUB_OUTPUT
            echo "ref=${{ github.ref }}" >> $GITHUB_OUTPUT
          else
            PR="${{ github.event.workflow_run.pull_requests[0].number }}"
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
            echo "url=https://turres-ssi-tools-pr-${PR}.onrender.com" >> $GITHUB_OUTPUT
            echo "pr=${PR}" >> $GITHUB_OUTPUT
            echo "ref=${HEAD_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Skip if no PR found
        if: steps.target.outputs.pr == '' && github.event_name != 'workflow_dispatch'
        run: |
          echo "::warning::No PR number found in workflow_run event — skipping UAT"
          exit 0

      # ── Checkout the PR branch code (not default branch) ────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      # ── Wait for deployment readiness ───────────────────────────────────
      - name: Wait for preview environment to respond
        run: |
          URL="${{ steps.target.outputs.url }}"
          echo "Waiting for ${URL} to respond…"
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${URL}/api/v1" || echo "000")
            if [ "$STATUS" != "000" ] && [ "$STATUS" != "502" ] && [ "$STATUS" != "503" ]; then
              echo "✅ Preview environment is up (HTTP ${STATUS})"
              exit 0
            fi
            echo "  Attempt ${i}/18 — status ${STATUS}, waiting 10 s…"
            sleep 10
          done
          echo "❌ Preview environment did not respond after 3 minutes"
          exit 1

      # ── Seed test account ───────────────────────────────────────────────
      # Creates the owner account on first run; exits cleanly if it already exists.
      - name: Seed UAT owner account
        env:
          PLATFORM_BASE_URL: ${{ steps.target.outputs.url }}
          PLATFORM_EMAIL: ${{ secrets.PLATFORM_TEST_EMAIL }}
          PLATFORM_PASSWORD: ${{ secrets.PLATFORM_TEST_PASSWORD }}
        run: node test-harness/seed-uat-account.mjs

      # ── Run Playwright tests ────────────────────────────────────────────
      - name: Run UAT tests
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
          PLATFORM_EMAIL: ${{ secrets.PLATFORM_TEST_EMAIL }}
          PLATFORM_PASSWORD: ${{ secrets.PLATFORM_TEST_PASSWORD }}
          SSI_TEST_EMAIL: ${{ secrets.SSI_TEST_EMAIL }}
          CI: 'true'
        run: npx playwright test
        working-directory: e2e

      # ── Upload test report ──────────────────────────────────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pr-${{ steps.target.outputs.pr || 'manual' }}
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload test results (screenshots, traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-pr-${{ steps.target.outputs.pr || 'manual' }}
          path: e2e/test-results/
          retention-days: 14

      # ── Post result as PR comment ───────────────────────────────────────
      - name: Comment UAT result on PR
        if: always() && steps.target.outputs.pr != ''
        uses: actions/github-script@v7
        with:
          script: |
            const pr = parseInt('${{ steps.target.outputs.pr }}')
            if (!pr) return

            const passed = '${{ job.status }}' === 'success'
            const emoji = passed ? '✅' : '❌'
            const status = passed ? 'passed' : 'failed'
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

            const body = [
              `${emoji} **UAT Tests ${status}** against \`${{ steps.target.outputs.url }}\``,
              '',
              passed
                ? 'All Playwright E2E tests passed.'
                : `⚠️ Some tests failed. [View workflow run](${runUrl}) and download the Playwright report artifact for details.`,
              '',
              '> To disable UAT tests: set repo variable `E2E_ENABLED` = `false`',
            ].join('\n')

            // Update existing UAT comment or create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
            })
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('UAT Tests')
            )
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              })
            }
