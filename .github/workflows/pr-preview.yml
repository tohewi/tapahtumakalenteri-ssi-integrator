name: V8 PR Preview Environment

# Creates, updates, and deletes Render preview environments for v8 pull requests.
#
# Key design: PR previews share the v8 project's PostgreSQL and Redis instances.
# Each PR gets its own PostgreSQL schema (DB_SCHEMA=pr_{NUMBER}) for data isolation.
# Only a web service is created per PR — no per-PR database provisioning.
# This keeps costs low ($7/mo per active PR) and avoids free-tier DB expiry issues.
#
# This workflow:
# 1. Creates a new Render web service when a PR is opened (format: turres-ssi-tools-v8-pr-{NUMBER})
# 2. Connects it to the shared v8 DATABASE_URL and REDIS_URL (from GitHub secrets)
# 3. Triggers redeployment when new commits are pushed to the PR
# 4. Drops the PR's PostgreSQL schema and deletes the web service when the PR is closed/merged
# 5. Posts preview URLs and status as PR comments
#
# Required GitHub Secrets:
# - RENDER_API_KEY: Render API token
# - RENDER_OWNER_ID: Render workspace ID (tea-d62r4ucoud1c73d50qg0)
# - RENDER_V8_DATABASE_URL: Shared v8 PostgreSQL external connection string
# - RENDER_V8_REDIS_URL: Shared v8 Redis external connection string
#
# Optional GitHub Secrets copied to preview envs:
# - SSI_ADMIN_EMAIL, SSI_ADMIN_PASSWORD, SSI_ADMIN_API_KEY
# - RESEND_API_KEY, EMAIL_FROM, SSI_BASE_URL
# - STAFFING_CRON_SECRET, STAFFING_API_URL

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [release/r80-match-manager-base]

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        if: github.event.action != 'closed'

      - name: Generate preview service name
        id: preview-name
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          SERVICE_NAME="turres-ssi-tools-v8-pr-${PR_NUMBER}"
          echo "service_name=${SERVICE_NAME}" >> $GITHUB_OUTPUT
          echo "Preview service name: ${SERVICE_NAME}"

      - name: Check if preview service exists
        id: check-service
        if: github.event.action != 'closed'
        run: |
          SERVICE_NAME="${{ steps.preview-name.outputs.service_name }}"

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services?name=${SERVICE_NAME}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "200" ]; then
            SERVICE_COUNT=$(echo "$BODY" | jq '. | length')
            if [ "$SERVICE_COUNT" -gt 0 ]; then
              SERVICE_ID=$(echo "$BODY" | jq -r '.[0].service.id')
              SERVICE_URL=$(echo "$BODY" | jq -r '.[0].service.serviceDetails.url')
              echo "exists=true" >> $GITHUB_OUTPUT
              echo "service_id=${SERVICE_ID}" >> $GITHUB_OUTPUT
              echo "service_url=${SERVICE_URL}" >> $GITHUB_OUTPUT
              echo "Service exists: ${SERVICE_ID} at ${SERVICE_URL}"
            else
              echo "exists=false" >> $GITHUB_OUTPUT
              echo "Service does not exist"
            fi
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Service does not exist or API error (HTTP ${HTTP_CODE})"
          fi

      - name: Create preview service (web-only, shared DB)
        id: create-service
        if: github.event.action != 'closed' && steps.check-service.outputs.exists != 'true'
        env:
          PREVIEW_SSI_ADMIN_EMAIL: ${{ secrets.SSI_ADMIN_EMAIL }}
          PREVIEW_SSI_ADMIN_PASSWORD: ${{ secrets.SSI_ADMIN_PASSWORD }}
          PREVIEW_SSI_ADMIN_API_KEY: ${{ secrets.SSI_ADMIN_API_KEY }}
          PREVIEW_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PREVIEW_EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          PREVIEW_SSI_BASE_URL: ${{ secrets.SSI_BASE_URL }}
          PREVIEW_STAFFING_CRON_SECRET: ${{ secrets.STAFFING_CRON_SECRET }}
          PREVIEW_STAFFING_API_URL: ${{ secrets.STAFFING_API_URL }}
          PREVIEW_PLATFORM_CREDENTIALS_KEY: ${{ secrets.PLATFORM_CREDENTIALS_KEY }}
          PREVIEW_MFA_SECRET_KEY: ${{ secrets.MFA_SECRET_KEY }}
        run: |
          SERVICE_NAME="${{ steps.preview-name.outputs.service_name }}"
          BRANCH_NAME="${{ github.head_ref }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          APP_URL="https://${SERVICE_NAME}.onrender.com"
          SESSION_SECRET=$(openssl rand -base64 32)
          DB_SCHEMA="pr_${PR_NUMBER}"

          # Build env vars — uses shared v8 DATABASE_URL and REDIS_URL from GitHub secrets
          # DB_SCHEMA isolates each PR into its own PostgreSQL schema within the shared DB
          ENV_VARS=$(jq -cn \
            --arg nodeEnv "production" \
            --arg sessionSecret "${SESSION_SECRET}" \
            --arg logLevel "info" \
            --arg appUrl "${APP_URL}" \
            --arg dbSchema "${DB_SCHEMA}" \
            --arg databaseUrl "${{ secrets.RENDER_V8_DATABASE_URL }}" \
            --arg redisUrl "${{ secrets.RENDER_V8_REDIS_URL }}" \
            --arg ssiAdminEmail "${PREVIEW_SSI_ADMIN_EMAIL}" \
            --arg ssiAdminPassword "${PREVIEW_SSI_ADMIN_PASSWORD}" \
            --arg ssiAdminApiKey "${PREVIEW_SSI_ADMIN_API_KEY}" \
            --arg resendApiKey "${PREVIEW_RESEND_API_KEY}" \
            --arg emailFrom "${PREVIEW_EMAIL_FROM}" \
            --arg ssiBaseUrl "${PREVIEW_SSI_BASE_URL}" \
            --arg staffingCronSecret "${PREVIEW_STAFFING_CRON_SECRET}" \
            --arg staffingApiUrl "${PREVIEW_STAFFING_API_URL}" \
            --arg platformCredentialsKey "${PREVIEW_PLATFORM_CREDENTIALS_KEY}" \
            --arg mfaSecretKey "${PREVIEW_MFA_SECRET_KEY}" \
            '[
              {"key": "NODE_ENV", "value": $nodeEnv},
              {"key": "SESSION_SECRET", "value": $sessionSecret},
              {"key": "LOG_LEVEL", "value": $logLevel},
              {"key": "APP_URL", "value": $appUrl},
              {"key": "DB_SCHEMA", "value": $dbSchema}
            ]
            + (if $databaseUrl != "" then [{"key": "DATABASE_URL", "value": $databaseUrl}] else [] end)
            + (if $redisUrl != "" then [{"key": "REDIS_URL", "value": $redisUrl}] else [] end)
            + (if $ssiAdminEmail != "" then [{"key": "SSI_ADMIN_EMAIL", "value": $ssiAdminEmail}] else [] end)
            + (if $ssiAdminPassword != "" then [{"key": "SSI_ADMIN_PASSWORD", "value": $ssiAdminPassword}] else [] end)
            + (if $ssiAdminApiKey != "" then [{"key": "SSI_ADMIN_API_KEY", "value": $ssiAdminApiKey}] else [] end)
            + (if $resendApiKey != "" then [{"key": "RESEND_API_KEY", "value": $resendApiKey}] else [] end)
            + (if $emailFrom != "" then [{"key": "EMAIL_FROM", "value": $emailFrom}] else [] end)
            + (if $ssiBaseUrl != "" then [{"key": "SSI_BASE_URL", "value": $ssiBaseUrl}] else [] end)
            + (if $staffingCronSecret != "" then [{"key": "STAFFING_CRON_SECRET", "value": $staffingCronSecret}] else [] end)
            + (if $staffingApiUrl != "" then [{"key": "STAFFING_API_URL", "value": $staffingApiUrl}] else [] end)
            + (if $platformCredentialsKey != "" then [{"key": "PLATFORM_CREDENTIALS_KEY", "value": $platformCredentialsKey}] else [] end)
            + (if $mfaSecretKey != "" then [{"key": "MFA_SECRET_KEY", "value": $mfaSecretKey}] else [] end)')

          PAYLOAD=$(jq -cn \
            --arg serviceName "${SERVICE_NAME}" \
            --arg ownerId "${RENDER_OWNER_ID}" \
            --arg repoUrl "https://github.com/${{ github.repository }}" \
            --arg branchName "${BRANCH_NAME}" \
            --arg buildCommand "cd scoring-ui && npm install --include=dev && npm run build && cd ../scoring-proxy && npm ci" \
            --arg startCommand "cd scoring-proxy && node server.js" \
            --argjson envVars "${ENV_VARS}" \
            '{
              "type": "web_service",
              "name": $serviceName,
              "ownerId": $ownerId,
              "repo": $repoUrl,
              "branch": $branchName,
              "autoDeploy": "yes",
              "serviceDetails": {
                "env": "node",
                "plan": "starter",
                "region": "frankfurt",
                "envSpecificDetails": {
                  "buildCommand": $buildCommand,
                  "startCommand": $startCommand
                }
              },
              "envVars": $envVars
            }')

          echo "Creating preview service: ${SERVICE_NAME}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.render.com/v1/services")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "201" ]; then
            SERVICE_ID=$(echo "$BODY" | jq -r '.service.id')
            SERVICE_URL=$(echo "$BODY" | jq -r '.service.serviceDetails.url')
            echo "service_id=${SERVICE_ID}" >> $GITHUB_OUTPUT
            echo "service_url=${SERVICE_URL}" >> $GITHUB_OUTPUT
            echo "✅ Preview service created: ${SERVICE_ID} at ${SERVICE_URL}"
          else
            echo "❌ Failed to create preview service (HTTP ${HTTP_CODE})"
            echo "$BODY" | jq '.' 2>/dev/null || echo "$BODY"
            exit 1
          fi

      - name: Trigger redeploy on existing preview service
        if: github.event.action == 'synchronize' && steps.check-service.outputs.exists == 'true'
        run: |
          SERVICE_ID="${{ steps.check-service.outputs.service_id }}"
          echo "Triggering redeploy for ${SERVICE_ID}..."
          # Render auto-deploys on commit if autoDeploy=yes, so this is a no-op.
          # The service will pick up the new commit automatically.
          echo "✅ Render will auto-deploy from the updated branch."

      - name: Comment on PR with preview URL
        if: github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const serviceName = '${{ steps.preview-name.outputs.service_name }}';
            const serviceUrl = '${{ steps.create-service.outputs.service_url || steps.check-service.outputs.service_url }}';
            const serviceId = '${{ steps.create-service.outputs.service_id || steps.check-service.outputs.service_id }}';
            const isNewService = '${{ steps.check-service.outputs.exists }}' !== 'true';

            const action = isNewService ? 'created' : 'updated';
            const emoji = isNewService ? '🎉' : '🔄';

            const body = `${emoji} **V8 Preview environment ${action}!**

            🚀 **Service:** \`${serviceName}\`
            🔗 **URL:** ${serviceUrl}
            📊 **Dashboard:** https://dashboard.render.com/web/${serviceId}

            ${isNewService ? '⏳ **First deployment in progress** — the preview will be available in a few minutes.' : '⏳ **Deployment in progress** — your changes are being deployed.'}

            > Uses shared v8 database with isolated PostgreSQL schema (\`pr_${context.issue.number}\`). Schema is auto-cleaned on PR close.

            This preview will be automatically deleted when this PR is closed or merged.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('V8 Preview environment')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Clean up PR database schema
        if: github.event.action == 'closed'
        env:
          DATABASE_URL: ${{ secrets.RENDER_V8_DATABASE_EXTERNAL_URL }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          SCHEMA_NAME="pr_${PR_NUMBER}"

          if [ -n "${DATABASE_URL}" ]; then
            echo "Dropping schema: ${SCHEMA_NAME}"
            psql "${DATABASE_URL}?sslmode=require" -c "DROP SCHEMA IF EXISTS \"${SCHEMA_NAME}\" CASCADE" 2>&1 || true
            echo "✅ Database schema cleaned up: ${SCHEMA_NAME}"
          else
            echo "⚠️  RENDER_V8_DATABASE_EXTERNAL_URL not set — skipping schema cleanup"
          fi

      - name: Delete preview service (web only — shared DB preserved)
        if: github.event.action == 'closed'
        run: |
          SERVICE_NAME="${{ steps.preview-name.outputs.service_name }}"
          echo "Checking for preview service to delete: ${SERVICE_NAME}"

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services?name=${SERVICE_NAME}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "200" ]; then
            SERVICE_COUNT=$(echo "$BODY" | jq '. | length')
            if [ "$SERVICE_COUNT" -gt 0 ]; then
              SERVICE_ID=$(echo "$BODY" | jq -r '.[0].service.id')
              echo "Deleting preview service: ${SERVICE_ID}"

              DELETE_RESPONSE=$(curl -s -w "\n%{http_code}" -X DELETE \
                -H "Authorization: Bearer ${RENDER_API_KEY}" \
                "https://api.render.com/v1/services/${SERVICE_ID}")

              DELETE_HTTP_CODE=$(echo "$DELETE_RESPONSE" | tail -n1)
              if [ "$DELETE_HTTP_CODE" = "204" ]; then
                echo "✅ Preview service deleted (shared DB preserved)"
              else
                echo "⚠️  Failed to delete preview service (HTTP ${DELETE_HTTP_CODE})"
              fi
            else
              echo "ℹ️  No preview service found to delete"
            fi
          else
            echo "⚠️  Failed to query services (HTTP ${HTTP_CODE})"
          fi

      - name: Comment on PR about deletion
        if: github.event.action == 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const serviceName = '${{ steps.preview-name.outputs.service_name }}';
            const prNumber = context.issue.number;
            const body = `🗑️ **V8 Preview environment deleted**\n\nThe preview service \`${serviceName}\` and database schema \`pr_${prNumber}\` have been cleaned up.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
