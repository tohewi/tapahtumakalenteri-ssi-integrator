name: PR Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        if: github.event.action != 'closed'

      - name: Generate preview service name
        id: preview-name
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          SERVICE_NAME="turres-ssi-tools-pr-${PR_NUMBER}"
          echo "service_name=${SERVICE_NAME}" >> $GITHUB_OUTPUT
          echo "Preview service name: ${SERVICE_NAME}"

      - name: Check if preview service exists
        id: check-service
        if: github.event.action != 'closed'
        run: |
          set -euo pipefail
          SERVICE_NAME="${{ steps.preview-name.outputs.service_name }}"

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services?name=${SERVICE_NAME}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "200" ]; then
            COUNT=$(echo "$BODY" | jq '. | length')
            if [ "$COUNT" -gt 0 ]; then
              SERVICE_ID=$(echo "$BODY" | jq -r '.[0].service.id')
              echo "exists=true" >> $GITHUB_OUTPUT
              echo "service_id=${SERVICE_ID}" >> $GITHUB_OUTPUT
              echo "Service exists with ID: ${SERVICE_ID}"
            else
              echo "exists=false" >> $GITHUB_OUTPUT
              echo "Service does not exist"
            fi
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Service does not exist or API error (HTTP ${HTTP_CODE})"
          fi

      - name: Check if preview database exists
        id: check-db
        if: github.event.action != 'closed'
        run: |
          set -euo pipefail
          SERVICE_NAME="${{ steps.preview-name.outputs.service_name }}"
          DB_NAME="${SERVICE_NAME}-db"

          echo "Checking for preview database: ${DB_NAME}"

          DB_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/postgres?name=${DB_NAME}")

          DB_HTTP_CODE=$(echo "$DB_RESPONSE" | tail -n1)
          DB_BODY=$(echo "$DB_RESPONSE" | sed '$d')

          if [ "$DB_HTTP_CODE" = "200" ]; then
            DB_COUNT=$(echo "$DB_BODY" | jq '. | length')
            if [ "$DB_COUNT" -gt 0 ]; then
              DB_ID=$(echo "$DB_BODY" | jq -r '.[0].postgres.id // .[0].id')
              echo "db_exists=true" >> $GITHUB_OUTPUT
              echo "database_id=${DB_ID}" >> $GITHUB_OUTPUT
              echo "database_name=${DB_NAME}" >> $GITHUB_OUTPUT
              echo "DB exists with ID: ${DB_ID}"
            else
              echo "db_exists=false" >> $GITHUB_OUTPUT
              echo "DB does not exist"
            fi
          else
            echo "db_exists=false" >> $GITHUB_OUTPUT
            echo "DB query failed (HTTP ${DB_HTTP_CODE})"
            echo "$DB_BODY" | jq '.' || echo "$DB_BODY"
          fi

      - name: Create preview database
        id: create-database
        if: github.event.action != 'closed' && steps.check-db.outputs.db_exists != 'true'
        run: |
          set -euo pipefail
          SERVICE_NAME="${{ steps.preview-name.outputs.service_name }}"
          DB_NAME="${SERVICE_NAME}-db"
          OWNER_ID="${{ secrets.RENDER_OWNER_ID }}"

          echo "Creating preview database: ${DB_NAME}"

          DB_PAYLOAD=$(jq -n \
            --arg type "postgres" \
            --arg name "$DB_NAME" \
            --arg owner_id "$OWNER_ID" \
            --arg region "frankfurt" \
            --arg plan "free" \
            --arg version "16" \
            --arg db_name "ssitools" \
            --arg db_user "ssitools" \
            '{
              type: $type,
              name: $name,
              ownerId: $owner_id,
              region: $region,
              plan: $plan,
              version: $version,
              databaseName: $db_name,
              databaseUser: $db_user,
              ipAllowList: []
            }')

          DB_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$DB_PAYLOAD" \
            "https://api.render.com/v1/postgres")

          DB_HTTP_CODE=$(echo "$DB_RESPONSE" | tail -n1)
          DB_BODY=$(echo "$DB_RESPONSE" | sed '$d')

          if [ "$DB_HTTP_CODE" = "201" ]; then
            DB_ID=$(echo "$DB_BODY" | jq -r '.id // .postgres.id')
            echo "database_id=${DB_ID}" >> $GITHUB_OUTPUT
            echo "database_name=${DB_NAME}" >> $GITHUB_OUTPUT
            echo "✅ Preview database created successfully"
            echo "   Database ID: ${DB_ID}"
            echo "   Database Name: ${DB_NAME}"
          else
            echo "❌ Failed to create preview database (HTTP ${DB_HTTP_CODE})"
            echo "$DB_BODY" | jq '.' || echo "$DB_BODY"
            exit 1
          fi

      - name: Select database outputs
        id: db
        if: github.event.action != 'closed'
        run: |
          set -euo pipefail
          # Prefer newly created DB outputs, otherwise use existing DB outputs
          DB_ID="${{ steps.create-database.outputs.database_id }}"
          DB_NAME="${{ steps.create-database.outputs.database_name }}"

          if [ -z "${DB_ID}" ] || [ "${DB_ID}" = "null" ]; then
            DB_ID="${{ steps.check-db.outputs.database_id }}"
            DB_NAME="${{ steps.check-db.outputs.database_name }}"
          fi

          echo "database_id=${DB_ID}" >> $GITHUB_OUTPUT
          echo "database_name=${DB_NAME}" >> $GITHUB_OUTPUT
          echo "Using DB: ${DB_NAME} (${DB_ID})"

      - name: Wait for Postgres + get connection string
        id: db-conn
        if: github.event.action != 'closed'
        run: |
          set -euo pipefail
          DB_ID="${{ steps.db.outputs.database_id }}"

          echo "Waiting for Render Postgres connection info: ${DB_ID}"

          for i in {1..60}; do
            RESP=$(curl -s -w "\n%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              "https://api.render.com/v1/postgres/${DB_ID}/connection-info")

            HTTP_CODE=$(echo "$RESP" | tail -n1)
            BODY=$(echo "$RESP" | sed '$d')

            if [ "$HTTP_CODE" = "200" ]; then
              EXT=$(echo "$BODY" | jq -r '.externalConnectionString // empty')
              INT=$(echo "$BODY" | jq -r '.internalConnectionString // empty')

              # Prefer internal conn string for Render-to-Render traffic; fall back to external.
              CONN="${INT}"
              if [ -z "$CONN" ]; then
                CONN="${EXT}"
              fi

              if [ -n "$CONN" ]; then
                echo "✅ Got connection string"
                echo "database_url=${CONN}" >> $GITHUB_OUTPUT
                exit 0
              fi

              echo "Attempt $i: HTTP 200 but connection string empty (unexpected)"
            else
              echo "Attempt $i: HTTP ${HTTP_CODE} (not ready yet)"
            fi

            sleep 5
          done

          echo "❌ DB connection info not ready after waiting"
          echo "$BODY" | jq . || true
          exit 1

      - name: Create preview service (without DATABASE_URL)
        id: create-service
        if: github.event.action != 'closed' && steps.check-service.outputs.exists != 'true'
        run: |
          set -euo pipefail
          SERVICE_NAME="${{ steps.preview-name.outputs.service_name }}"
          BRANCH_NAME="${{ github.head_ref }}"
          OWNER_ID="${{ secrets.RENDER_OWNER_ID }}"
          REPO_URL="https://github.com/${{ github.repository }}"

          SESSION_SECRET=$(openssl rand -base64 32)

          echo "Creating preview service: ${SERVICE_NAME}"
          echo "Branch: ${BRANCH_NAME}"
          echo "Repo URL: ${REPO_URL}"

          PAYLOAD=$(jq -n \
            --arg type "web_service" \
            --arg name "$SERVICE_NAME" \
            --arg owner_id "$OWNER_ID" \
            --arg repo "$REPO_URL" \
            --arg branch "$BRANCH_NAME" \
            --arg auto_deploy "yes" \
            --arg env "node" \
            --arg plan "free" \
            --arg region "frankfurt" \
            --arg build_cmd "cd scoring-ui && npm install --include=dev && npm run build && cd ../scoring-proxy && npm install" \
            --arg start_cmd "cd scoring-proxy && node server.js" \
            --arg session_secret "$SESSION_SECRET" \
            '{
              type: $type,
              name: $name,
              ownerId: $owner_id,
              repo: $repo,
              branch: $branch,
              autoDeploy: $auto_deploy,
              serviceDetails: {
                env: $env,
                plan: $plan,
                region: $region,
                envSpecificDetails: {
                  buildCommand: $build_cmd,
                  startCommand: $start_cmd
                }
              },
              envVars: [
                { key: "NODE_ENV", value: "production" },
                { key: "SESSION_SECRET", value: $session_secret },
                { key: "LOG_LEVEL", value: "debug" }
              ]
            }')

          echo "$PAYLOAD" | jq '.'

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.render.com/v1/services")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "201" ]; then
            SERVICE_ID=$(echo "$BODY" | jq -r '.service.id')
            SERVICE_URL=$(echo "$BODY" | jq -r '.service.serviceDetails.url')
            echo "service_id=${SERVICE_ID}" >> $GITHUB_OUTPUT
            echo "service_url=${SERVICE_URL}" >> $GITHUB_OUTPUT
            echo "✅ Preview service created"
            echo "   Service ID: ${SERVICE_ID}"
            echo "   URL: ${SERVICE_URL}"
          else
            echo "❌ Failed to create preview service (HTTP ${HTTP_CODE})"
            echo "$BODY" | jq '.' || echo "$BODY"
            exit 1
          fi

      - name: Select service outputs
        id: svc
        if: github.event.action != 'closed'
        run: |
          set -euo pipefail
          SERVICE_ID="${{ steps.create-service.outputs.service_id }}"
          SERVICE_URL="${{ steps.create-service.outputs.service_url }}"

          if [ -z "${SERVICE_ID}" ] || [ "${SERVICE_ID}" = "null" ]; then
            SERVICE_ID="${{ steps.check-service.outputs.service_id }}"
          fi

          # If we reused an existing service, fetch its URL
          if [ -z "${SERVICE_URL}" ] || [ "${SERVICE_URL}" = "null" ]; then
            INFO=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              "https://api.render.com/v1/services/${SERVICE_ID}")
            SERVICE_URL=$(echo "$INFO" | jq -r '.serviceDetails.url // .service.serviceDetails.url // empty')
          fi

          echo "service_id=${SERVICE_ID}" >> $GITHUB_OUTPUT
          echo "service_url=${SERVICE_URL}" >> $GITHUB_OUTPUT
          echo "Using service: ${SERVICE_ID} (${SERVICE_URL})"

      - name: Set DATABASE_URL env var on service
        if: github.event.action != 'closed'
        run: |
          set -euo pipefail
          SERVICE_ID="${{ steps.svc.outputs.service_id }}"
          DATABASE_URL="${{ steps.db-conn.outputs.database_url }}"

          # Put env var (key/value) — API requires value
          PAYLOAD=$(jq -n --arg value "$DATABASE_URL" '{ value: $value }')

          RESP=$(curl -s -w "\n%{http_code}" -X PUT \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.render.com/v1/services/${SERVICE_ID}/env-vars/DATABASE_URL")

          CODE=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')

          if [ "$CODE" = "200" ] || [ "$CODE" = "201" ]; then
            echo "✅ DATABASE_URL set on service"
          else
            echo "❌ Failed to set DATABASE_URL (HTTP ${CODE})"
            echo "$BODY" | jq '.' || echo "$BODY"
            exit 1
          fi

      - name: Trigger deploy
        if: github.event.action != 'closed'
        run: |
          set -euo pipefail
          SERVICE_ID="${{ steps.svc.outputs.service_id }}"

          PAYLOAD='{"clearCache":"do_not_clear"}'

          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.render.com/v1/services/${SERVICE_ID}/deploys")

          CODE=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')

          if [ "$CODE" = "201" ]; then
            DEPLOY_ID=$(echo "$BODY" | jq -r '.id')
            echo "✅ Deploy triggered: ${DEPLOY_ID}"
          else
            echo "❌ Failed to trigger deploy (HTTP ${CODE})"
            echo "$BODY" | jq '.' || echo "$BODY"
            exit 1
          fi

      - name: Comment on PR with preview URL
        if: github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const serviceName = '${{ steps.preview-name.outputs.service_name }}';
            const serviceUrl = '${{ steps.svc.outputs.service_url }}';
            const serviceId = '${{ steps.svc.outputs.service_id }}';
            const isNewService = '${{ steps.check-service.outputs.exists }}' !== 'true';

            const action = isNewService ? 'created' : 'updated';
            const emoji = isNewService ? '🎉' : '🔄';

            const body = `${emoji} **Preview environment ${action}!**

            🚀 **Service:** \`${serviceName}\`
            🔗 **URL:** ${serviceUrl}
            📊 **Dashboard:** https://dashboard.render.com/web/${serviceId}

            ⏳ **Deployment in progress** - Your changes are being deployed.

            This preview environment will be automatically deleted when this PR is closed or merged.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Preview environment')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Delete preview service
        if: github.event.action == 'closed'
        run: |
          set -euo pipefail
          SERVICE_NAME="${{ steps.preview-name.outputs.service_name }}"

          echo "Checking for preview service to delete: ${SERVICE_NAME}"

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services?name=${SERVICE_NAME}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "200" ]; then
            COUNT=$(echo "$BODY" | jq '. | length')
            if [ "$COUNT" -gt 0 ]; then
              SERVICE_ID=$(echo "$BODY" | jq -r '.[0].service.id')
              echo "Deleting preview service: ${SERVICE_ID}"
              DEL=$(curl -s -w "\n%{http_code}" -X DELETE \
                -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
                "https://api.render.com/v1/services/${SERVICE_ID}")
              CODE=$(echo "$DEL" | tail -n1)
              if [ "$CODE" = "204" ]; then
                echo "✅ Preview service deleted"
              else
                echo "⚠️ Failed to delete preview service (HTTP ${CODE})"
              fi
            else
              echo "ℹ️ No preview service found"
            fi
          else
            echo "⚠️ Failed to query services (HTTP ${HTTP_CODE})"
          fi

      - name: Delete preview database
        if: github.event.action == 'closed'
        run: |
          set -euo pipefail
          SERVICE_NAME="${{ steps.preview-name.outputs.service_name }}"
          DB_NAME="${SERVICE_NAME}-db"

          echo "Checking for preview database to delete: ${DB_NAME}"

          DB_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/postgres?name=${DB_NAME}")

          DB_HTTP_CODE=$(echo "$DB_RESPONSE" | tail -n1)
          DB_BODY=$(echo "$DB_RESPONSE" | sed '$d')

          if [ "$DB_HTTP_CODE" = "200" ]; then
            DB_COUNT=$(echo "$DB_BODY" | jq '. | length')
            if [ "$DB_COUNT" -gt 0 ]; then
              DB_ID=$(echo "$DB_BODY" | jq -r '.[0].postgres.id // .[0].id')
              echo "Deleting preview database: ${DB_ID}"
              DEL=$(curl -s -w "\n%{http_code}" -X DELETE \
                -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
                "https://api.render.com/v1/postgres/${DB_ID}")
              CODE=$(echo "$DEL" | tail -n1)
              if [ "$CODE" = "204" ]; then
                echo "✅ Preview database deleted"
              else
                echo "⚠️ Failed to delete preview database (HTTP ${CODE})"
              fi
            else
              echo "ℹ️ No preview database found"
            fi
          else
            echo "⚠️ Failed to query databases (HTTP ${DB_HTTP_CODE})"
          fi

      - name: Comment on PR about deletion
        if: github.event.action == 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const serviceName = '${{ steps.preview-name.outputs.service_name }}';
            const body = `🗑️ **Preview environment deleted**

            The preview environment \`${serviceName}\` has been deleted as this PR is now closed.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
