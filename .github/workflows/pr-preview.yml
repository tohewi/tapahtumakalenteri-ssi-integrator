name: PR Preview Environment

# Automatically creates, updates, and deletes Render preview environments for pull requests.
#
# This workflow:
# 1. Creates a new Render service when a PR is opened (format: turres-ssi-tools-pr-{NUMBER})
# 2. Triggers redeployment when new commits are pushed to the PR
# 3. Deletes the preview service when the PR is closed or merged
# 4. Posts preview URLs and status as PR comments
#
# Required GitHub Secrets:
# - RENDER_API_KEY: Render API token (generate in Render Dashboard → Account Settings → API Keys)
# - RENDER_OWNER_ID: Render workspace ID (format: tea-XXXXXXXXXXXXX)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        if: github.event.action != 'closed'

      - name: Generate preview service name
        id: preview-name
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          SERVICE_NAME="turres-ssi-tools-pr-${PR_NUMBER}"
          echo "service_name=${SERVICE_NAME}" >> $GITHUB_OUTPUT
          echo "Preview service name: ${SERVICE_NAME}"

      - name: Check if preview service exists
        id: check-service
        if: github.event.action != 'closed'
        run: |
          SERVICE_NAME="${{ steps.preview-name.outputs.service_name }}"

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services?name=${SERVICE_NAME}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "200" ]; then
            SERVICE_COUNT=$(echo "$BODY" | jq '. | length')
            if [ "$SERVICE_COUNT" -gt 0 ]; then
              SERVICE_ID=$(echo "$BODY" | jq -r '.[0].service.id')
              BUILD_CMD=$(echo "$BODY" | jq -r '.[0].service.serviceDetails.envSpecificDetails.buildCommand')
              echo "exists=true" >> $GITHUB_OUTPUT
              echo "service_id=${SERVICE_ID}" >> $GITHUB_OUTPUT
              echo "build_command=${BUILD_CMD}" >> $GITHUB_OUTPUT
              echo "Service exists with ID: ${SERVICE_ID}"
              echo "Current build command: ${BUILD_CMD}"
            else
              echo "exists=false" >> $GITHUB_OUTPUT
              echo "Service does not exist"
            fi
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Service does not exist or API error (HTTP ${HTTP_CODE})"
          fi

      - name: Delete service if build command is outdated
        id: delete-if-outdated
        if: github.event.action != 'closed' && steps.check-service.outputs.exists == 'true' && (contains(steps.check-service.outputs.build_command, 'npm ci') || !contains(steps.check-service.outputs.build_command, '--include=dev'))
        run: |
          SERVICE_ID="${{ steps.check-service.outputs.service_id }}"
          SERVICE_NAME="${{ steps.preview-name.outputs.service_name }}"
          DB_NAME="${SERVICE_NAME}-db"

          echo "⚠️  Service has outdated build command, deleting and will recreate..."

          DELETE_RESPONSE=$(curl -s -w "\n%{http_code}" -X DELETE \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${SERVICE_ID}")

          DELETE_HTTP_CODE=$(echo "$DELETE_RESPONSE" | tail -n1)

          if [ "$DELETE_HTTP_CODE" = "204" ]; then
            echo "✅ Outdated service deleted successfully"
            echo "deleted=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  Failed to delete service (HTTP ${DELETE_HTTP_CODE})"
            echo "deleted=false" >> $GITHUB_OUTPUT
          fi

          echo "Checking for associated database to delete: ${DB_NAME}"

          DB_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/postgres?name=${DB_NAME}")

          DB_HTTP_CODE=$(echo "$DB_RESPONSE" | tail -n1)
          DB_BODY=$(echo "$DB_RESPONSE" | sed '$d')

          if [ "$DB_HTTP_CODE" = "200" ]; then
            DB_COUNT=$(echo "$DB_BODY" | jq '. | length')
            if [ "$DB_COUNT" -gt 0 ]; then
              DB_ID=$(echo "$DB_BODY" | jq -r '.[0].id')

              echo "Deleting associated database: ${DB_ID}"

              DELETE_DB_RESPONSE=$(curl -s -w "\n%{http_code}" -X DELETE \
                -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
                "https://api.render.com/v1/postgres/${DB_ID}")

              DELETE_DB_HTTP_CODE=$(echo "$DELETE_DB_RESPONSE" | tail -n1)

              if [ "$DELETE_DB_HTTP_CODE" = "204" ]; then
                echo "✅ Associated database deleted successfully"
              else
                echo "⚠️  Failed to delete database (HTTP ${DELETE_DB_HTTP_CODE})"
              fi
            else
              echo "ℹ️  No associated database found"
            fi
          fi

      - name: Check if preview database exists
        id: check-db
        if: github.event.action != 'closed'
        run: |
          SERVICE_NAME="${{ steps.preview-name.outputs.service_name }}"
          DB_NAME="${SERVICE_NAME}-db"

          RESP=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/postgres?name=${DB_NAME}")

          CODE=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')

          if [ "$CODE" = "200" ] && [ "$(echo "$BODY" | jq 'length')" -gt 0 ]; then
            DB_ID=$(echo "$BODY" | jq -r '.[0].id')
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "database_id=$DB_ID" >> $GITHUB_OUTPUT
            echo "database_name=$DB_NAME" >> $GITHUB_OUTPUT
            echo "DB exists: $DB_ID"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "DB does not exist"
          fi

      - name: Create preview database
        id: create-database
        if: github.event.action != 'closed' && steps.check-db.outputs.exists != 'true' && (steps.check-service.outputs.exists != 'true' || steps.delete-if-outdated.outputs.deleted == 'true')
        run: |
          SERVICE_NAME="${{ steps.preview-name.outputs.service_name }}"
          DB_NAME="${SERVICE_NAME}-db"
          OWNER_ID="${{ secrets.RENDER_OWNER_ID }}"

          echo "Creating preview database: ${DB_NAME}"

          DB_PAYLOAD=$(jq -n \
            --arg type "postgres" \
            --arg name "$DB_NAME" \
            --arg owner_id "$OWNER_ID" \
            --arg region "frankfurt" \
            --arg plan "free" \
            --arg version "16" \
            --arg db_name "ssitools" \
            --arg db_user "ssitools" \
            '{
              type: $type,
              name: $name,
              ownerId: $owner_id,
              region: $region,
              plan: $plan,
              version: $version,
              databaseName: $db_name,
              databaseUser: $db_user,
              ipAllowList: []
            }')

          DB_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$DB_PAYLOAD" \
            "https://api.render.com/v1/postgres")

          DB_HTTP_CODE=$(echo "$DB_RESPONSE" | tail -n1)
          DB_BODY=$(echo "$DB_RESPONSE" | sed '$d')

          if [ "$DB_HTTP_CODE" = "201" ]; then
            DB_ID=$(echo "$DB_BODY" | jq -r '.id')
            echo "database_id=${DB_ID}" >> $GITHUB_OUTPUT
            echo "database_name=${DB_NAME}" >> $GITHUB_OUTPUT
            echo "✅ Preview database created successfully"
            echo "   Database ID: ${DB_ID}"
            echo "   Database Name: ${DB_NAME}"
          else
            echo "❌ Failed to create preview database (HTTP ${DB_HTTP_CODE})"
            echo "$DB_BODY" | jq '.' || echo "$DB_BODY"
            exit 1
          fi

      - name: Wait for preview database to be ready
        if: github.event.action != 'closed'
        run: |
          DB_ID="${{ steps.create-database.outputs.database_id || steps.check-db.outputs.database_id }}"
          echo "Waiting for Render Postgres to be ready: $DB_ID"

          for i in {1..40}; do
            RESP=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              "https://api.render.com/v1/postgres/${DB_ID}")

            STATUS=$(echo "$RESP" | jq -r '.status? // .postgres.status? // .state? // empty')

            echo "Attempt $i: status='${STATUS}'"

            if [ "$STATUS" -eq "Available" ]; then
              echo "✅ DB is ready"
              exit 0
            fi

            sleep 5
          done

          echo "❌ DB not ready after waiting"
          echo "$RESP" | jq . || true
          exit 1

      - name: Create preview service
        id: create-service
        if: github.event.action != 'closed' && (steps.check-service.outputs.exists != 'true' || steps.delete-if-outdated.outputs.deleted == 'true')
        run: |
          SERVICE_NAME="${{ steps.preview-name.outputs.service_name }}"
          BRANCH_NAME="${{ github.head_ref }}"
          DB_ID="${{ steps.create-database.outputs.database_id || steps.check-db.outputs.database_id }}"
          DB_NAME="${{ steps.create-database.outputs.database_name || steps.check-db.outputs.database_name }}"
          OWNER_ID="${{ secrets.RENDER_OWNER_ID }}"
          REPO_URL="https://github.com/${{ github.repository }}"

          SESSION_SECRET=$(openssl rand -base64 32)

          echo "Creating preview service: ${SERVICE_NAME}"
          echo "Branch: ${BRANCH_NAME}"
          echo "Database ID: ${DB_ID}"
          echo "Database Name: ${DB_NAME}"
          echo "Owner ID: ${OWNER_ID}"
          echo "Repo URL: ${REPO_URL}"

          PAYLOAD=$(jq -n \
            --arg type "web_service" \
            --arg name "$SERVICE_NAME" \
            --arg owner_id "$OWNER_ID" \
            --arg repo "$REPO_URL" \
            --arg branch "$BRANCH_NAME" \
            --arg auto_deploy "yes" \
            --arg env "node" \
            --arg plan "free" \
            --arg region "frankfurt" \
            --arg build_cmd "cd scoring-ui && npm install --include=dev && npm run build && cd ../scoring-proxy && npm install" \
            --arg start_cmd "cd scoring-proxy && node server.js" \
            --arg session_secret "$SESSION_SECRET" \
            --arg db_id "$DB_ID" \
            '{
              type: $type,
              name: $name,
              ownerId: $owner_id,
              repo: $repo,
              branch: $branch,
              autoDeploy: $auto_deploy,
              serviceDetails: {
                env: $env,
                plan: $plan,
                region: $region,
                envSpecificDetails: {
                  buildCommand: $build_cmd,
                  startCommand: $start_cmd
                }
              },
              envVars: [
                { key: "NODE_ENV", value: "production" },
                { key: "SESSION_SECRET", value: $session_secret },
                { key: "LOG_LEVEL", value: "debug" },
                {
                  key: "DATABASE_URL",
                  fromDatabase: {
                    databaseId: $db_id,
                    property: "connectionString"
                  }
                }
              ]
            }')

          echo "Payload (formatted):"
          echo "$PAYLOAD" | jq '.'

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.render.com/v1/services")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "201" ]; then
            SERVICE_ID=$(echo "$BODY" | jq -r '.service.id')
            SERVICE_URL=$(echo "$BODY" | jq -r '.service.serviceDetails.url')
            echo "service_id=${SERVICE_ID}" >> $GITHUB_OUTPUT
            echo "service_url=${SERVICE_URL}" >> $GITHUB_OUTPUT
            echo "✅ Preview service created successfully"
            echo "   Service ID: ${SERVICE_ID}"
            echo "   URL: ${SERVICE_URL}"
          else
            echo "❌ Failed to create preview service (HTTP ${HTTP_CODE})"
            echo "$BODY" | jq '.' || echo "$BODY"
            exit 1
          fi

      - name: Trigger deploy for existing service
        id: deploy-service
        if: github.event.action != 'closed' && steps.check-service.outputs.exists == 'true' && steps.delete-if-outdated.outputs.deleted != 'true'
        run: |
          SERVICE_ID="${{ steps.check-service.outputs.service_id }}"
          PAYLOAD='{"clearCache": "do_not_clear"}'

          echo "Triggering deploy for service: ${SERVICE_ID}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.render.com/v1/services/${SERVICE_ID}/deploys")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "201" ]; then
            DEPLOY_ID=$(echo "$BODY" | jq -r '.id')
            echo "deploy_id=${DEPLOY_ID}" >> $GITHUB_OUTPUT
            echo "✅ Deploy triggered successfully"
            echo "   Deploy ID: ${DEPLOY_ID}"

            SERVICE_INFO=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              "https://api.render.com/v1/services/${SERVICE_ID}")

            SERVICE_URL=$(echo "$SERVICE_INFO" | jq -r '.serviceDetails.url')
            echo "service_url=${SERVICE_URL}" >> $GITHUB_OUTPUT
            echo "   URL: ${SERVICE_URL}"
          else
            echo "❌ Failed to trigger deploy (HTTP ${HTTP_CODE})"
            echo "$BODY" | jq '.' || echo "$BODY"
            exit 1
          fi

      - name: Comment on PR with preview URL
        if: github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const serviceName = '${{ steps.preview-name.outputs.service_name }}';
            const serviceUrl = '${{ steps.create-service.outputs.service_url || steps.deploy-service.outputs.service_url }}';
            const serviceId = '${{ steps.create-service.outputs.service_id || steps.check-service.outputs.service_id }}';
            const isNewService = '${{ steps.check-service.outputs.exists }}' !== 'true';

            const action = isNewService ? 'created' : 'updated';
            const emoji = isNewService ? '🎉' : '🔄';

            const body = `${emoji} **Preview environment ${action}!**

            🚀 **Service:** \`${serviceName}\`
            🔗 **URL:** ${serviceUrl}
            📊 **Dashboard:** https://dashboard.render.com/web/${serviceId}

            ${isNewService ? '⏳ **First deployment in progress** - The preview environment is being built and will be available in a few minutes.' : '⏳ **Deployment in progress** - Your changes are being deployed.'}

            ${isNewService ? '> **Note:** Preview services on Render may take 30-60 seconds to wake up on the first request after inactivity.' : ''}

            This preview environment will be automatically deleted when this PR is closed or merged.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Preview environment')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Delete preview service
        if: github.event.action == 'closed'
        run: |
          SERVICE_NAME="${{ steps.preview-name.outputs.service_name }}"

          echo "Checking for preview service to delete: ${SERVICE_NAME}"

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services?name=${SERVICE_NAME}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "200" ]; then
            SERVICE_COUNT=$(echo "$BODY" | jq '. | length')
            if [ "$SERVICE_COUNT" -gt 0 ]; then
              SERVICE_ID=$(echo "$BODY" | jq -r '.[0].service.id')

              echo "Deleting preview service: ${SERVICE_ID}"

              DELETE_RESPONSE=$(curl -s -w "\n%{http_code}" -X DELETE \
                -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
                "https://api.render.com/v1/services/${SERVICE_ID}")

              DELETE_HTTP_CODE=$(echo "$DELETE_RESPONSE" | tail -n1)

              if [ "$DELETE_HTTP_CODE" = "204" ]; then
                echo "✅ Preview service deleted successfully"
              else
                echo "⚠️  Failed to delete preview service (HTTP ${DELETE_HTTP_CODE})"
                echo "$DELETE_RESPONSE" | sed '$d'
              fi
            else
              echo "ℹ️  No preview service found to delete"
            fi
          else
            echo "⚠️  Failed to query services (HTTP ${HTTP_CODE})"
            echo "$BODY"
          fi

      - name: Delete preview database
        if: github.event.action == 'closed'
        run: |
          SERVICE_NAME="${{ steps.preview-name.outputs.service_name }}"
          DB_NAME="${SERVICE_NAME}-db"

          echo "Checking for preview database to delete: ${DB_NAME}"

          DB_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/postgres?name=${DB_NAME}")

          DB_HTTP_CODE=$(echo "$DB_RESPONSE" | tail -n1)
          DB_BODY=$(echo "$DB_RESPONSE" | sed '$d')

          if [ "$DB_HTTP_CODE" = "200" ]; then
            DB_COUNT=$(echo "$DB_BODY" | jq '. | length')
            if [ "$DB_COUNT" -gt 0 ]; then
              DB_ID=$(echo "$DB_BODY" | jq -r '.[0].id')

              echo "Deleting preview database: ${DB_ID}"

              DELETE_DB_RESPONSE=$(curl -s -w "\n%{http_code}" -X DELETE \
                -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
                "https://api.render.com/v1/postgres/${DB_ID}")

              DELETE_DB_HTTP_CODE=$(echo "$DELETE_DB_RESPONSE" | tail -n1)

              if [ "$DELETE_DB_HTTP_CODE" = "204" ]; then
                echo "✅ Preview database deleted successfully"
              else
                echo "⚠️  Failed to delete preview database (HTTP ${DELETE_DB_HTTP_CODE})"
                echo "$DELETE_DB_RESPONSE" | sed '$d'
              fi
            else
              echo "ℹ️  No preview database found to delete"
            fi
          else
            echo "⚠️  Failed to query databases (HTTP ${DB_HTTP_CODE})"
            echo "$DB_BODY"
          fi

      - name: Comment on PR about deletion
        if: github.event.action == 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const serviceName = '${{ steps.preview-name.outputs.service_name }}';

            const body = `🗑️ **Preview environment deleted**

            The preview environment \`${serviceName}\` has been deleted as this PR is now closed.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
