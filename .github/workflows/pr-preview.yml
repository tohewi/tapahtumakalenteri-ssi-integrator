name: PR Preview Environment

# Automatically creates, updates, and deletes Render preview environments for pull requests.
#
# This workflow:
# 1. Creates a new Render service when a PR is opened (format: turres-ssi-tools-pr-{NUMBER})
# 2. Triggers redeployment when new commits are pushed to the PR
# 3. Deletes the preview service when the PR is closed or merged
# 4. Posts preview URLs and status as PR comments
#
# Required GitHub Secrets:
# - RENDER_API_KEY: Render API token (generate in Render Dashboard → Account Settings → API Keys)
# - RENDER_OWNER_ID: Render workspace ID (format: tea-XXXXXXXXXXXXX)
#   Find by running: curl --request GET --url 'https://api.render.com/v1/owners?limit=20' --header 'authorization: Bearer YOUR_API_KEY' | jq '.[0].owner.id'
#   For this repo: tea-d62r4ucoud1c73d50qg0
#
# Optional GitHub Secrets copied to preview envs (recommended):
# - SSI_ADMIN_EMAIL
# - SSI_ADMIN_PASSWORD
# - SSI_ADMIN_API_KEY
# - RESEND_API_KEY
# - EMAIL_FROM
# - SSI_BASE_URL
# - STAFFING_CRON_SECRET
# - STAFFING_API_URL
#
# Preview services are created with the same configuration as production:
# - Runtime: Node.js
# - Plan: Starter
# - Region: Frankfurt
# - Build: cd scoring-ui && npm install --include=dev && npm run build && cd ../apps/scoring-app && npm ci
# - Start: cd apps/scoring-app && node server.js
#
# Documentation: docs/instructions/PR-PREVIEW-DEPLOYMENTS.md

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
      PREVIEW_SSI_ADMIN_EMAIL: ${{ secrets.SSI_ADMIN_EMAIL }}
      PREVIEW_SSI_ADMIN_PASSWORD: ${{ secrets.SSI_ADMIN_PASSWORD }}
      PREVIEW_SSI_ADMIN_API_KEY: ${{ secrets.SSI_ADMIN_API_KEY }}
      PREVIEW_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      PREVIEW_EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      PREVIEW_SSI_BASE_URL: ${{ secrets.SSI_BASE_URL }}
      PREVIEW_STAFFING_CRON_SECRET: ${{ secrets.STAFFING_CRON_SECRET }}
      PREVIEW_STAFFING_API_URL: ${{ secrets.STAFFING_API_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        if: github.event.action != 'closed'

      - name: Generate preview service name
        id: preview-name
        run: |
          # Generate a unique service name for this PR
          PR_NUMBER="${{ github.event.pull_request.number }}"
          SERVICE_NAME="turres-ssi-tools-pr-${PR_NUMBER}"
          echo "service_name=${SERVICE_NAME}" >> $GITHUB_OUTPUT
          echo "Preview service name: ${SERVICE_NAME}"

      - name: Check if preview service exists
        id: check-service
        if: github.event.action != 'closed'
        run: |
          SERVICE_NAME="${{ steps.preview-name.outputs.service_name }}"

          # Query Render API to check if service exists
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services?name=${SERVICE_NAME}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "200" ]; then
            # Check if any services were returned
            SERVICE_COUNT=$(echo "$BODY" | jq '. | length')
            if [ "$SERVICE_COUNT" -gt 0 ]; then
              SERVICE_ID=$(echo "$BODY" | jq -r '.[0].service.id')
              SERVICE_URL=$(echo "$BODY" | jq -r '.[0].service.serviceDetails.url')
              BUILD_CMD=$(echo "$BODY" | jq -r '.[0].service.serviceDetails.envSpecificDetails.buildCommand')
              echo "exists=true" >> $GITHUB_OUTPUT
              echo "service_id=${SERVICE_ID}" >> $GITHUB_OUTPUT
              echo "service_url=${SERVICE_URL}" >> $GITHUB_OUTPUT
              echo "build_command=${BUILD_CMD}" >> $GITHUB_OUTPUT
              echo "Service exists with ID: ${SERVICE_ID}"
              echo "Service URL: ${SERVICE_URL}"
              echo "Current build command: ${BUILD_CMD}"
            else
              echo "exists=false" >> $GITHUB_OUTPUT
              echo "Service does not exist"
            fi
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Service does not exist or API error (HTTP ${HTTP_CODE})"
          fi

      - name: Delete service if build command is outdated
        id: delete-if-outdated
        if: github.event.action != 'closed' && steps.check-service.outputs.exists == 'true' && (!contains(steps.check-service.outputs.build_command, 'npm ci') || !contains(steps.check-service.outputs.build_command, '--include=dev'))
        run: |
          SERVICE_ID="${{ steps.check-service.outputs.service_id }}"
          SERVICE_NAME="${{ steps.preview-name.outputs.service_name }}"
          
          echo "⚠️  Service has outdated build command, deleting and will recreate..."
          
          DELETE_RESPONSE=$(curl -s -w "\n%{http_code}" -X DELETE \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${SERVICE_ID}")
          
          DELETE_HTTP_CODE=$(echo "$DELETE_RESPONSE" | tail -n1)
          
          if [ "$DELETE_HTTP_CODE" = "204" ]; then
            echo "✅ Outdated service deleted successfully"
            echo "deleted=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  Failed to delete service (HTTP ${DELETE_HTTP_CODE})"
            echo "deleted=false" >> $GITHUB_OUTPUT
          fi

      - name: Create preview service
        id: create-service
        if: github.event.action != 'closed' && (steps.check-service.outputs.exists != 'true' || steps.delete-if-outdated.outputs.deleted == 'true')
        run: |
          SERVICE_NAME="${{ steps.preview-name.outputs.service_name }}"
          BRANCH_NAME="${{ github.head_ref }}"
          APP_URL="https://${SERVICE_NAME}.onrender.com"

          # Generate a random session secret (base64-encoded, 256-bit)
          SESSION_SECRET=$(openssl rand -base64 32)

          OPTIONAL_SECRETS=(
            PREVIEW_SSI_ADMIN_EMAIL
            PREVIEW_SSI_ADMIN_PASSWORD
            PREVIEW_SSI_ADMIN_API_KEY
            PREVIEW_RESEND_API_KEY
            PREVIEW_EMAIL_FROM
            PREVIEW_SSI_BASE_URL
            PREVIEW_STAFFING_CRON_SECRET
            PREVIEW_STAFFING_API_URL
          )
          MISSING_SECRETS=()
          for secret_name in "${OPTIONAL_SECRETS[@]}"; do
            if [ -z "${!secret_name}" ]; then
              MISSING_SECRETS+=("${secret_name}")
            fi
          done
          if [ "${#MISSING_SECRETS[@]}" -gt 0 ]; then
            echo "::warning::Missing optional preview secrets (${MISSING_SECRETS[*]}). Features depending on these values may not work in preview."
          fi

          ENV_VARS=$(jq -cn \
            --arg nodeEnv "production" \
            --arg sessionSecret "${SESSION_SECRET}" \
            --arg logLevel "info" \
            --arg appUrl "${APP_URL}" \
            --arg ssiAdminEmail "${PREVIEW_SSI_ADMIN_EMAIL}" \
            --arg ssiAdminPassword "${PREVIEW_SSI_ADMIN_PASSWORD}" \
            --arg ssiAdminApiKey "${PREVIEW_SSI_ADMIN_API_KEY}" \
            --arg resendApiKey "${PREVIEW_RESEND_API_KEY}" \
            --arg emailFrom "${PREVIEW_EMAIL_FROM}" \
            --arg ssiBaseUrl "${PREVIEW_SSI_BASE_URL}" \
            --arg staffingCronSecret "${PREVIEW_STAFFING_CRON_SECRET}" \
            --arg staffingApiUrl "${PREVIEW_STAFFING_API_URL}" \
            '[
              {"key": "NODE_ENV", "value": $nodeEnv},
              {"key": "SESSION_SECRET", "value": $sessionSecret},
              {"key": "LOG_LEVEL", "value": $logLevel},
              {"key": "APP_URL", "value": $appUrl}
            ]
            + (if $ssiAdminEmail != "" then [{"key": "SSI_ADMIN_EMAIL", "value": $ssiAdminEmail}] else [] end)
            + (if $ssiAdminPassword != "" then [{"key": "SSI_ADMIN_PASSWORD", "value": $ssiAdminPassword}] else [] end)
            + (if $ssiAdminApiKey != "" then [{"key": "SSI_ADMIN_API_KEY", "value": $ssiAdminApiKey}] else [] end)
            + (if $resendApiKey != "" then [{"key": "RESEND_API_KEY", "value": $resendApiKey}] else [] end)
            + (if $emailFrom != "" then [{"key": "EMAIL_FROM", "value": $emailFrom}] else [] end)
            + (if $ssiBaseUrl != "" then [{"key": "SSI_BASE_URL", "value": $ssiBaseUrl}] else [] end)
            + (if $staffingCronSecret != "" then [{"key": "STAFFING_CRON_SECRET", "value": $staffingCronSecret}] else [] end)
            + (if $staffingApiUrl != "" then [{"key": "STAFFING_API_URL", "value": $staffingApiUrl}] else [] end)')

          # Create the service using Render API
          # Note: preview services use in-memory session store (no REDIS_URL).
          # This is acceptable for short-lived test environments.
          PAYLOAD=$(jq -cn \
            --arg serviceName "${SERVICE_NAME}" \
            --arg ownerId "${RENDER_OWNER_ID}" \
            --arg repoUrl "https://github.com/${{ github.repository }}" \
            --arg branchName "${BRANCH_NAME}" \
            --arg buildCommand "cd packages/ssi-core && npm install && cd ../../scoring-ui && npm install --include=dev && npm run build && cd ../apps/scoring-app && npm install --omit=dev" \
            --arg startCommand "cd apps/scoring-app && node server.js" \
            --argjson envVars "${ENV_VARS}" \
            '{
              "type": "web_service",
              "name": $serviceName,
              "ownerId": $ownerId,
              "repo": $repoUrl,
              "branch": $branchName,
              "autoDeploy": "yes",
              "serviceDetails": {
                "env": "node",
                "plan": "starter",
                "region": "frankfurt",
                "nodeVersion": "24",
                "envSpecificDetails": {
                  "buildCommand": $buildCommand,
                  "startCommand": $startCommand
                }
              },
              "envVars": $envVars
            }')

          echo "Creating preview service: ${SERVICE_NAME}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.render.com/v1/services")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "201" ]; then
            SERVICE_ID=$(echo "$BODY" | jq -r '.service.id')
            SERVICE_URL=$(echo "$BODY" | jq -r '.service.serviceDetails.url')
            echo "service_id=${SERVICE_ID}" >> $GITHUB_OUTPUT
            echo "service_url=${SERVICE_URL}" >> $GITHUB_OUTPUT
            echo "✅ Preview service created successfully"
            echo "   Service ID: ${SERVICE_ID}"
            echo "   URL: ${SERVICE_URL}"
          else
            echo "❌ Failed to create preview service (HTTP ${HTTP_CODE})"
            echo "$BODY" | jq '.' || echo "$BODY"
            exit 1
          fi

      - name: Comment on PR with preview URL
        if: github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const serviceName = '${{ steps.preview-name.outputs.service_name }}';
            const serviceUrl = '${{ steps.create-service.outputs.service_url || steps.check-service.outputs.service_url }}';
            const serviceId = '${{ steps.create-service.outputs.service_id || steps.check-service.outputs.service_id }}';
            const isNewService = '${{ steps.check-service.outputs.exists }}' !== 'true';

            const action = isNewService ? 'created' : 'updated';
            const emoji = isNewService ? '🎉' : '🔄';

            const body = `${emoji} **Preview environment ${action}!**

            🚀 **Service:** \`${serviceName}\`
            🔗 **URL:** ${serviceUrl}
            📊 **Dashboard:** https://dashboard.render.com/web/${serviceId}

            ${isNewService ? '⏳ **First deployment in progress** - The preview environment is being built and will be available in a few minutes.' : '⏳ **Deployment in progress** - Your changes are being deployed.'}

            ${isNewService ? '> **Note:** Preview services on Render may take 30-60 seconds to wake up on the first request after inactivity.' : ''}

            This preview environment will be automatically deleted when this PR is closed or merged.`;

            // Check if we already commented on this PR
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Preview environment')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Delete preview service
        if: github.event.action == 'closed'
        run: |
          SERVICE_NAME="${{ steps.preview-name.outputs.service_name }}"

          echo "Checking for preview service to delete: ${SERVICE_NAME}"

          # Query Render API to find the service
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services?name=${SERVICE_NAME}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "200" ]; then
            SERVICE_COUNT=$(echo "$BODY" | jq '. | length')

            if [ "$SERVICE_COUNT" -gt 0 ]; then
              SERVICE_ID=$(echo "$BODY" | jq -r '.[0].service.id')

              echo "Deleting preview service: ${SERVICE_ID}"

              DELETE_RESPONSE=$(curl -s -w "\n%{http_code}" -X DELETE \
                -H "Authorization: Bearer ${RENDER_API_KEY}" \
                "https://api.render.com/v1/services/${SERVICE_ID}")

              DELETE_HTTP_CODE=$(echo "$DELETE_RESPONSE" | tail -n1)

              if [ "$DELETE_HTTP_CODE" = "204" ]; then
                echo "✅ Preview service deleted successfully"
              else
                echo "⚠️  Failed to delete preview service (HTTP ${DELETE_HTTP_CODE})"
                echo "$DELETE_RESPONSE" | sed '$d'
                # Don't fail the workflow if deletion fails
              fi
            else
              echo "ℹ️  No preview service found to delete"
            fi
          else
            echo "⚠️  Failed to query services (HTTP ${HTTP_CODE})"
            echo "$BODY"
            # Don't fail the workflow if query fails
          fi

      - name: Comment on PR about deletion
        if: github.event.action == 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const serviceName = '${{ steps.preview-name.outputs.service_name }}';

            const body = `🗑️ **Preview environment deleted**

            The preview environment \`${serviceName}\` has been deleted as this PR is now closed.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
