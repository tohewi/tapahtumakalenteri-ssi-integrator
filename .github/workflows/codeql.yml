name: CodeQL Security Scan

# Runs GitHub's CodeQL static analysis engine on every PR targeting main
# and on a weekly schedule to catch security issues early.
#
# CodeQL checks for: injection vulnerabilities, credential leaks, XSS,
# prototype pollution, insecure crypto, path traversal, and more.
#
# Results appear in the GitHub Security → Code scanning tab.
# Any High/Critical findings block the PR merge (via branch protection).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan at 02:00 UTC Monday — catches newly-published CVE patterns
    - cron: '0 2 * * 1'

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Use the security-extended query suite for broader coverage:
          # includes CWE-top-25, OWASP top-10, and injection patterns
          queries: security-extended

      # No build step needed for JavaScript — CodeQL auto-builds JS/TS
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
