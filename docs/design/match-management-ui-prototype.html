<!DOCTYPE html>

    .view{display:none}.view.active{display:block}
    .nav-link{cursor:pointer}.nav-link.active{background:#0ea5e9;color:#fff}
    .nav-link:not(.active):hover{background:#e0f2fe}
    .tab-btn.active{border-bottom:2px solid #0ea5e9;color:#0284c7;font-weight:600}
    .card-hover:hover{box-shadow:0 4px 12px rgba(0,0,0,.1);transform:translateY(-1px);transition:.15s}
    .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:9999px;font-size:.75rem;font-weight:500}
    .proto-note{background:#fef3c7;border:1px dashed #f59e0b;border-radius:6px;padding:8px 12px;font-size:.8rem;color:#92400e;margin-bottom:16px}
  </style>
</head>
<body class="text-gray-800">
<!-- Top bar -->
<header class="bg-white border-b shadow-sm sticky top-0 z-50">
  <div class="max-w-7xl mx-auto flex items-center justify-between px-4 h-14">

    </div>

        <div class="w-8 h-8 bg-sky-100 rounded-full flex items-center justify-center text-sky-700 text-sm font-semibold">TW</div>
        <span class="text-sm text-gray-600 hidden sm:inline">tohewi@live.com</span>
        <button onclick="showView('platform-welcome')" class="text-xs text-gray-400 hover:text-gray-600 ml-2">Sign out</button>
      </div>
    </div>
  </div>
</header>
<div class="max-w-7xl mx-auto flex min-h-[calc(100vh-3.5rem)]">
<!-- Sidebar -->
<nav class="w-56 bg-white border-r p-3 flex-shrink-0 hidden md:block">
  <div class="text-xs uppercase tracking-wider text-gray-400 font-semibold mb-2 px-3">Management</div>
  <div class="space-y-0.5" id="nav-links">
    <div class="nav-link active rounded-md px-3 py-2 text-sm" data-view="dashboard">&#127968; Dashboard</div>
    <div class="nav-link rounded-md px-3 py-2 text-sm" data-view="templates">&#128203; Templates</div>
    <div class="nav-link rounded-md px-3 py-2 text-sm" data-view="schedule">&#128197; Schedule</div>

    <div class="nav-link rounded-md px-3 py-2 text-sm" data-view="roster">&#128101; Roster</div>

function showView(name) {
  document.getElementById('main-content').innerHTML = views[name] || '<div class="text-gray-400 py-20 text-center">View not found</div>';
  document.querySelectorAll('.nav-link').forEach(n => {
    n.classList.toggle('active', n.dataset.view === name);
  });
}

// Nav click handlers
document.querySelectorAll('.nav-link[data-view]').forEach(link => {
  link.addEventListener('click', () => showView(link.dataset.view));
});

// Initial view
showView('dashboard');
