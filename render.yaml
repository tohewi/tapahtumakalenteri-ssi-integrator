projects:
  - name: turres-ssi-tools
    environments:
      - name: production
        services:
          # ── PostgreSQL for persistent platform data ──
          # Stores accounts, tenants, and future operational data.
          # The web service references this via DATABASE_URL → connectionString.
          - type: pserv
            name: turres-ssi-tools-db
            region: frankfurt
            plan: starter
            databaseName: turres_platform
            ipAllowList: []  # internal access only (private network)
          # ── Redis (Key Value) for session storage ──
          # Deployed alongside the web service. Internal-only (no public access).
          # The web service references this via REDIS_URL → connectionString.
          - type: keyvalue
            name: turres-ssi-tools-redis
            region: frankfurt
            plan: starter
            maxmemoryPolicy: allkeys-lru
            ipAllowList: []  # internal access only (private network)
          # ── Web service ──
          - type: web
            name: turres-ssi-tools
            runtime: node
            region: frankfurt
            plan: starter
            branch: main
            repo: https://github.com/tohewi/tapahtumakalenteri-ssi-integrator
            # PR previews are managed by .github/workflows/pr-preview.yml
            # to support all Render plans and deterministic naming.
            buildCommand: cd scoring-ui && npm install --include=dev && npm run build && cd ../scoring-proxy && npm ci
            startCommand: cd scoring-proxy && node server.js
            envVars:
              - key: NODE_ENV
                value: production
              - key: LOG_LEVEL
                value: info
              - key: APP_URL
                value: https://turres-ssi-tools.onrender.com
              - key: SESSION_SECRET
                generateValue: true
              - key: DATABASE_URL
                fromService:
                  name: turres-ssi-tools-db
                  type: pserv
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  name: turres-ssi-tools-redis
                  type: keyvalue
                  property: connectionString
